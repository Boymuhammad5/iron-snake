<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>AVENGERS: IRON STRIKE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff4500'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234fc3ff'/%3E%3C/svg%3E" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a12;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 30% 40%, #1a0a08 0%, #0a0a12 60%, #050508 100%);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    width: 100%; height: 100%;
    background: #0a0a12;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(5, 5, 12, 0.82);
    backdrop-filter: blur(4px);
    z-index: 10;
    padding: 24px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  .logo {
    font-size: clamp(14px, 3.5vw, 18px);
    letter-spacing: 0.45em;
    color: #c9a227;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(201, 162, 39, 0.5);
  }
  .title {
    font-size: clamp(32px, 9vw, 56px);
    font-weight: 900;
    letter-spacing: 0.06em;
    background: linear-gradient(180deg, #ffd700 0%, #ff4500 45%, #8b0000 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(255, 69, 0, 0.6));
    margin-bottom: 8px;
    line-height: 1.1;
  }
  .subtitle {
    color: #aaa;
    font-size: clamp(12px, 3vw, 15px);
    margin-bottom: 28px;
    max-width: 320px;
    line-height: 1.5;
  }
  .score-big {
    font-size: clamp(28px, 8vw, 42px);
    font-weight: 800;
    color: #ffd700;
    margin: 8px 0;
    text-shadow: 0 0 24px rgba(255, 215, 0, 0.45);
  }
  .meta { color: #888; font-size: 13px; margin-bottom: 6px; }
  .btn {
    margin-top: 18px;
    padding: 14px 42px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #1a0500;
    background: linear-gradient(180deg, #ffd700 0%, #ff8c00 50%, #ff4500 100%);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 28px rgba(255, 140, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn:active { transform: scale(0.96); }
  .controls-hint {
    margin-top: 22px;
    font-size: 11px;
    color: #666;
    line-height: 1.6;
  }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    font-size: 13px;
    font-weight: 700;
    text-shadow: 0 1px 3px #000;
  }
  #hud.hidden { display: none; }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; }
  .hud-right { text-align: right; }
  .hp-bar {
    width: 110px; height: 10px;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 2px;
  }
  .hp-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff4500, #ffd700);
    border-radius: 3px;
    transition: width 0.15s;
  }
  #touch-pad {
    position: absolute; bottom: 18px; left: 18px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255, 215, 0, 0.08);
    border: 2px solid rgba(255, 215, 0, 0.25);
    z-index: 6;
    touch-action: none;
    display: none;
  }
  #touch-pad.visible { display: block; }
  #touch-knob {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffd700, #ff4500);
    box-shadow: 0 0 16px rgba(255, 140, 0, 0.6);
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #fire-btn {
    position: absolute; bottom: 28px; right: 28px;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4fc3ff, #0066ff 60%, #003399);
    border: 3px solid rgba(255,255,255,0.35);
    box-shadow: 0 0 24px rgba(0, 150, 255, 0.7);
    z-index: 6;
    display: none;
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.05em;
    align-items: center;
    justify-content: center;
  }
  #fire-btn.visible { display: flex; }
  #fire-btn:active, #fire-btn.pressed {
    transform: scale(0.92);
    box-shadow: 0 0 32px rgba(0, 200, 255, 0.9);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div>❤ LIVES <span id="lives">3</span></div>
      <div class="hp-bar"><div class="hp-fill" id="hp"></div></div>
    </div>
    <div class="hud-right">
      <div>SCORE <span id="score">0</span></div>
      <div style="color:#c9a227;font-size:11px">BEST <span id="best">0</span></div>
      <div style="color:#888;font-size:11px">WAVE <span id="wave">1</span></div><div style="color:#4fc3ff;font-size:11px">BEAM <span id="beam">READY</span></div>
    </div>
  </div>
  
  <div id="fire-btn">UNI<br>BEAM</div>
  <div id="overlay">
    <div class="logo">MARVEL · AVENGERS</div>
    <div class="title">IRON STRIKE</div>
    <div class="subtitle" id="overlay-sub">Pilot Iron Man. Blast the drones.<br>Defend the city.</div>
    <div class="score-big" id="overlay-score" style="display:none"></div>
    <div class="meta" id="overlay-best" style="display:none"></div>
    <button class="btn" id="start-btn">ENGAGE</button>
    <div class="controls-hint">
      Keyboard: WASD / Arrows move · Space / Z fire<br>
      Touch: drag anywhere to fly · auto-fire · UNIBEAM button<br>Keyboard: X = Unibeam
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");
  const overlay = $("overlay"), overlaySub = $("overlay-sub"), overlayScore = $("overlay-score"), overlayBest = $("overlay-best");
  const startBtn = $("start-btn"), hud = $("hud"), livesEl = $("lives"), scoreEl = $("score"), bestEl = $("best"), waveEl = $("wave"), hpEl = $("hp"), beamEl = $("beam"), fireBtn = $("fire-btn");
  const BEST_KEY = "ironStrikeBest";
  let bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0; } catch (e) {}
  bestEl.textContent = bestScore;

  let W = 800, H = 450, dpr = 1, state = "menu", lastTs = 0, T = 0;
  let score = 0, lives = 3, hp = 100, wave = 1, waveKills = 0, waveTarget = 12, shake = 0, flash = 0, spawnTimer = 0, powerupTimer = 0;
  let bossActive = false, banner = null, beamCd = 0, beamTime = 0, slowmo = 0;
  const keys = Object.create(null);
  let isTouch = false;
  const player = { x: 100, y: 200, w: 46, h: 26, vx: 0, vy: 0, invuln: 0, fireCd: 0, rapid: 0, muzzle: 0, tx: null, ty: null };
  let bullets = [], enemies = [], eBullets = [], particles = [], rings = [], powerups = [], floaters = [];
  let stars = [], far = [], mid = [], clouds = [], scrollX = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ——— Audio (WebAudio, optional) ———
  let AC = null, master = null, noiseBuf = null;
  function audioInit() {
    if (AC) { if (AC.state === "suspended") AC.resume().catch(() => {}); return; }
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  function tone(f0, f1, dur, type, vol) {
    if (!AC) return;
    try {
      const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "square"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function noise(dur, vol, freq) {
    if (!AC) return;
    try {
      const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      s.buffer = noiseBuf; f.type = "lowpass"; f.frequency.setValueAtTime(freq || 1200, t); f.frequency.exponentialRampToValueAtTime(60, t + dur);
      g.gain.setValueAtTime(vol || 0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
    } catch (e) {}
  }
  let lastShotSfx = 0;
  const sfx = {
    shot() { if (T - lastShotSfx < 0.07) return; lastShotSfx = T; tone(1400, 300, 0.08, "sawtooth", 0.05); },
    hit() { tone(300, 120, 0.06, "square", 0.05); },
    boom(big) { noise(big ? 1.2 : 0.5, big ? 0.7 : 0.35, big ? 900 : 1600); tone(big ? 90 : 140, 30, big ? 0.8 : 0.3, "sine", 0.3); },
    hurt() { noise(0.25, 0.4, 3000); tone(200, 60, 0.3, "sawtooth", 0.12); },
    power() { tone(500, 1500, 0.25, "triangle", 0.15); },
    beam() { tone(120, 900, 1.0, "sawtooth", 0.12); noise(1.0, 0.2, 4000); },
    alarm() { tone(600, 400, 0.3, "square", 0.08); setTimeout(() => tone(600, 400, 0.3, "square", 0.08), 350); }
  };

  // ——— World setup ———
  function makeSkyline(n, minH, maxH, wMin, wMax) {
    const arr = []; let x = 0;
    while (x < W * 2 + 200) {
      const w = rnd(wMin, wMax), h = rnd(minH, maxH);
      const win = []; for (let i = 0; i < 14; i++) win.push([Math.random(), Math.random(), Math.random() < 0.5]);
      arr.push({ x, w, h, win, antenna: Math.random() < 0.25 });
      x += w + rnd(2, 10);
    }
    return { b: arr, len: x };
  }
  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    W = Math.max(320, Math.floor(r.width)); H = Math.max(240, Math.floor(r.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = []; for (let i = 0; i < 110; i++) stars.push({ x: rnd(0, W), y: rnd(0, H * 0.7), s: rnd(0.3, 1.8), tw: rnd(0, 6) });
    far = makeSkyline(0, H * 0.15, H * 0.38, 30, 70);
    mid = makeSkyline(0, H * 0.2, H * 0.55, 40, 90);
    clouds = []; for (let i = 0; i < 7; i++) clouds.push({ x: rnd(0, W), y: rnd(H * 0.05, H * 0.5), s: rnd(0.6, 1.6), sp: rnd(0.15, 0.4) });
  }

  function resetGame() {
    score = 0; lives = 3; hp = 100; wave = 1; waveKills = 0; waveTarget = 12; shake = 0; flash = 0;
    spawnTimer = 1; powerupTimer = 9; bossActive = false; beamCd = 0; beamTime = 0; slowmo = 0;
    Object.assign(player, { x: Math.min(120, W * 0.18), y: H * 0.5, vx: 0, vy: 0, invuln: 2, fireCd: 0, rapid: 0, muzzle: 0, tx: null, ty: null });
    bullets = []; enemies = []; eBullets = []; particles = []; rings = []; powerups = []; floaters = [];
    showBanner("WAVE 1", "Incoming drones");
    updateHud();
  }
  function showBanner(t, s) { banner = { t, s, life: 2.2 }; }
  function updateHud() {
    livesEl.textContent = lives; scoreEl.textContent = Math.floor(score); bestEl.textContent = bestScore; waveEl.textContent = wave;
    hpEl.style.width = clamp(hp, 0, 100) + "%";
    beamEl.textContent = beamCd > 0 ? Math.ceil(beamCd) + "s" : "READY";
    fireBtn.style.opacity = beamCd > 0 ? 0.45 : 1;
  }
  function showMenu(go) {
    state = go ? "gameover" : "menu";
    overlay.classList.remove("hidden"); hud.classList.add("hidden"); fireBtn.classList.remove("visible");
    if (go) {
      overlaySub.textContent = "Suit systems offline. J.A.R.V.I.S. is rebooting...";
      overlayScore.style.display = "block"; overlayScore.textContent = Math.floor(score);
      overlayBest.style.display = "block"; overlayBest.textContent = "BEST  " + bestScore + "  ·  WAVE " + wave;
      startBtn.textContent = "REBOOT";
    } else {
      overlaySub.innerHTML = "Suit up as Iron Man. Destroy the Ultron drone fleet.<br>Defend the city.";
      overlayScore.style.display = "none"; overlayBest.style.display = "none"; startBtn.textContent = "ENGAGE";
    }
  }
  function startGame() {
    audioInit(); resetGame(); state = "playing";
    overlay.classList.add("hidden"); hud.classList.remove("hidden");
    if (isTouch) fireBtn.classList.add("visible");
    lastTs = performance.now();
  }
  function gameOver() {
    if (score > bestScore) { bestScore = Math.floor(score); try { localStorage.setItem(BEST_KEY, String(bestScore)); } catch (e) {} }
    updateHud(); state = "dying"; setTimeout(() => showMenu(true), 1400);
  }

  // ——— Effects ———
  function burst(x, y, n, opt) {
    opt = opt || {};
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = rnd(0.3, 1) * (opt.speed || 160);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.8) * (opt.life || 1), max: 0.8 * (opt.life || 1),
        size: rnd(1, 3.5) * (opt.size || 1), kind: opt.kind || "spark", hue: opt.hue != null ? opt.hue + rnd(-15, 15) : rnd(15, 45), drag: opt.drag || 2.5, grav: opt.grav || 0 });
    }
  }
  function explode(x, y, scale) {
    scale = scale || 1;
    burst(x, y, 26 * scale, { speed: 260 * Math.sqrt(scale), hue: 30 });
    burst(x, y, 10 * scale, { kind: "fire", speed: 90 * scale, size: 4 * scale, life: 1 });
    burst(x, y, 8 * scale, { kind: "smoke", speed: 50 * scale, size: 5 * scale, life: 1.8, drag: 1 });
    burst(x, y, 6 * scale, { kind: "debris", speed: 220, grav: 300, drag: 0.5, life: 1.4 });
    rings.push({ x, y, r: 4, max: 60 * scale, life: 0.45 });
    shake = Math.max(shake, 5 * scale); sfx.boom(scale > 2);
  }

  // ——— Drawing ———
  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#05060f"); sky.addColorStop(0.45, "#141030"); sky.addColorStop(0.8, "#3a1424"); sky.addColorStop(1, "#6a2810");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(T * 2 + s.tw);
      ctx.fillStyle = "#dfe6ff"; ctx.fillRect((s.x - scrollX * 0.02 + W * 10) % W, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
    // moon
    const mx = W * 0.78, my = H * 0.2, mg = ctx.createRadialGradient(mx, my, 0, mx, my, 70);
    mg.addColorStop(0, "rgba(255,240,220,0.95)"); mg.addColorStop(0.25, "rgba(255,220,190,0.85)"); mg.addColorStop(0.3, "rgba(255,180,140,0.15)"); mg.addColorStop(1, "rgba(255,150,100,0)");
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, 70, 0, 7); ctx.fill();
    drawSky(far, 0.15, "#1a1430", "rgba(255,200,120,0.25)", false);
    for (const c of clouds) {
      const cx = ((c.x - scrollX * c.sp) % (W + 300) + W + 300) % (W + 300) - 150;
      ctx.fillStyle = "rgba(120,80,110,0.12)";
      for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.ellipse(cx + k * 30 * c.s, c.y + Math.sin(k) * 6, 50 * c.s, 14 * c.s, 0, 0, 7); ctx.fill(); }
    }
    drawSky(mid, 0.45, "#0d0a18", "rgba(255,210,130,0.75)", true);
    const glow = ctx.createLinearGradient(0, H * 0.7, 0, H);
    glow.addColorStop(0, "rgba(255,90,20,0)"); glow.addColorStop(1, "rgba(255,90,20,0.22)");
    ctx.fillStyle = glow; ctx.fillRect(0, H * 0.7, W, H * 0.3);
    // ground streak road
    ctx.fillStyle = "#07060c"; ctx.fillRect(0, H - 14, W, 14);
    ctx.fillStyle = "rgba(255,200,80,0.6)";
    for (let i = 0; i < W + 60; i += 60) ctx.fillRect(((i - scrollX * 1.2) % (W + 60) + W + 60) % (W + 60) - 30, H - 8, 22, 2);
  }
  function drawSky(L, par, col, winCol, detail) {
    const off = (scrollX * par) % L.len;
    ctx.fillStyle = col;
    for (let rep = 0; rep < 2; rep++) for (const b of L.b) {
      const x = b.x - off + rep * L.len; if (x > W || x + b.w < 0) continue;
      const top = H - 14 - b.h;
      ctx.fillStyle = col; ctx.fillRect(x, top, b.w, b.h + 14);
      if (b.antenna) { ctx.fillRect(x + b.w / 2 - 1, top - 18, 2, 18); if (Math.sin(T * 4 + b.x) > 0) { ctx.fillStyle = "#ff3030"; ctx.fillRect(x + b.w / 2 - 2, top - 20, 4, 3); } }
      ctx.fillStyle = winCol;
      const cols = Math.floor(b.w / 9), rows = Math.floor(b.h / 12);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const w = b.win[(r * 7 + c * 3) % 14]; if (!w[2]) continue;
        ctx.fillRect(x + 4 + c * 9, top + 6 + r * 12, detail ? 4 : 2, detail ? 5 : 3);
      }
      if (detail) { ctx.fillStyle = "rgba(255,255,255,0.04)"; ctx.fillRect(x, top, 3, b.h); }
    }
  }
  function drawIronMan(p) {
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.rotate(clamp(p.vy * 0.0016, -0.3, 0.3) + clamp(-p.vx * 0.0004, -0.1, 0.1));
    if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.45;
    // thruster flames (boots)
    const fl = 1 + (p.vx > 10 ? 0.6 : p.vx < -10 ? -0.4 : 0);
    for (const fy of [-5, 6]) {
      const len = (22 + Math.random() * 10) * fl;
      const g = ctx.createLinearGradient(-26, 0, -26 - len, 0);
      g.addColorStop(0, "rgba(255,255,255,0.95)"); g.addColorStop(0.2, "rgba(140,220,255,0.9)"); g.addColorStop(0.6, "rgba(60,120,255,0.5)"); g.addColorStop(1, "rgba(40,60,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-24, fy - 4); ctx.quadraticCurveTo(-26 - len * 0.6, fy - 2, -26 - len, fy); ctx.quadraticCurveTo(-26 - len * 0.6, fy + 2, -24, fy + 4); ctx.fill();
    }
    ctx.globalCompositeOperation = "lighter";
    const tg = ctx.createRadialGradient(-28, 0, 0, -28, 0, 22); tg.addColorStop(0, "rgba(100,180,255,0.5)"); tg.addColorStop(1, "rgba(0,80,255,0)");
    ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(-28, 0, 22, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    const red = ctx.createLinearGradient(0, -14, 0, 14); red.addColorStop(0, "#ff4a4a"); red.addColorStop(0.45, "#b3121f"); red.addColorStop(1, "#5a0610");
    const gold = ctx.createLinearGradient(0, -10, 0, 10); gold.addColorStop(0, "#fff2a8"); gold.addColorStop(0.4, "#f2c230"); gold.addColorStop(1, "#8a6408");
    // legs
    ctx.fillStyle = red;
    ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(-24, -8); ctx.lineTo(-26, -2); ctx.lineTo(-6, -1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, 2); ctx.lineTo(-24, 3); ctx.lineTo(-26, 9); ctx.lineTo(-6, 9); ctx.fill();
    ctx.fillStyle = gold; ctx.fillRect(-18, -7, 5, 5); ctx.fillRect(-18, 4, 5, 4);
    // torso

    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.stroke();

      if (hitTest(b.x, b.y, 4, player.x, player.y, 13)) { eBullets.splice(i, 1); hitPlayer(15); }
    }
    if (beamTime > 0) { beamTime -= dt; if (Math.random() < 0.8) burst(player.x + rnd(40, W), player.y + rnd(-14, 14), 1, { hue: 200, speed: 120, life: 0.4 }); }

    // enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i]; e.t += dt; if (e.hitFlash > 0) e.hitFlash -= dt;
      if (e.type === "boss") {
        const tx = W - e.r - 30; e.x += (tx - e.x) * dt * 1.2;
        e.y = H * 0.45 + Math.sin(e.t * 0.9) * (H * 0.28);
        e.charge = e.fireCd < 0.5 ? 1 - e.fireCd / 0.5 : 0;
      } else {
        e.x += e.vx * dt; e.y = e.baseY + Math.sin(e.t * e.freq + e.seed) * e.amp;
        if (e.type === "jet") e.baseY += (player.y - e.baseY) * dt * 0.4;
      }
      if (e.shoots && e.x < W - 10) { e.fireCd -= dt; if (e.fireCd <= 0) enemyFire(e); }
      if (beamTime > 0 && e.x > player.x && Math.abs(e.y - player.y) < e.r + 18) {
        e.hp -= dt * (e.type === "boss" ? 25 : 30); e.hitFlash = 0.05;
        if (e.hp <= 0) { killEnemy(i); continue; }
      }
      let dead = false;
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (hitTest(b.x, b.y, 4, e.x, e.y, e.r)) {
          bullets.splice(j, 1); e.hp -= b.dmg; e.hitFlash = 0.06; sfx.hit();
          burst(b.x, b.y, 5, { hue: 200, speed: 140, life: 0.4 });
          if (e.type === "boss") shake = Math.max(shake, 1.5);
          if (e.hp <= 0) { killEnemy(i); dead = true; break; }
        }
      }
      if (dead) continue;
      if (hitTest(e.x, e.y, e.r * 0.8, player.x, player.y, 14)) {
        if (e.type === "boss") hitPlayer(30);
        else { hitPlayer(e.type === "heavy" ? 35 : 22); explode(e.x, e.y, 1); enemies.splice(i, 1); }
        continue;
      }
      if (e.x < -60) enemies.splice(i, 1);
    }
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i]; p.x += p.vx * dt;
      if (hitTest(p.x, p.y, 14, player.x, player.y, 18)) {
        if (p.kind === "health") hp = Math.min(100, hp + 40); else if (p.kind === "rapid") player.rapid = 7; else { score += 1000; floaters.push({ x: p.x, y: p.y, t: "+1000", life: 1 }); }
        burst(p.x, p.y, 16, { hue: p.kind === "health" ? 140 : 200, speed: 120 }); sfx.power(); powerups.splice(i, 1); continue;
      }
      if (p.x < -30) powerups.splice(i, 1);
    }
    score += dt * 5 * wave;
    scoreEl.textContent = Math.floor(score); hpEl.style.width = clamp(hp, 0, 100) + "%";
  }

  // ——— Render ———
  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawBackground();
    for (const p of powerups) drawPowerup(p);
    for (const e of enemies) drawEnemy(e);
    if (state === "playing") drawIronMan(player);
    drawBullets();
    drawParticles();
    ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
    for (const f of floaters) { ctx.fillStyle = "rgba(255,220,100," + f.life + ")"; ctx.fillText(f.t, f.x, f.y); }
    if (state === "playing" && player.rapid > 0) { ctx.fillStyle = "rgba(79,195,255,0.9)"; ctx.font = "bold 10px sans-serif"; ctx.fillText("RAPID " + Math.ceil(player.rapid), player.x, player.y - 30); }
    ctx.restore();
    const boss = enemies.find(e => e.type === "boss");
    if (boss) {
      const bw = Math.min(360, W * 0.6), bx = (W - bw) / 2, by = H - 30;
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
      const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, "#ff2020"); g.addColorStop(1, "#ff9020");
      ctx.fillStyle = g; ctx.fillRect(bx, by, bw * clamp(boss.hp / boss.maxHp, 0, 1), 8);
      ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.fillText("ULTRON PRIME", W / 2, by - 6);
    }
    if (banner && state === "playing") {
      const a = clamp(Math.min(banner.life, 2.2 - banner.life) * 3, 0, 1);
      ctx.textAlign = "center"; ctx.fillStyle = "rgba(0,0,0," + 0.4 * a + ")"; ctx.fillRect(0, H * 0.38, W, 64);
      ctx.fillStyle = banner.t === "WARNING" ? "rgba(255,60,60," + a + ")" : "rgba(255,215,0," + a + ")";
      ctx.font = "900 30px sans-serif"; ctx.fillText(banner.t, W / 2, H * 0.38 + 34);
      ctx.fillStyle = "rgba(255,255,255," + a * 0.8 + ")"; ctx.font = "bold 12px sans-serif"; ctx.fillText(banner.s, W / 2, H * 0.38 + 54);
    }
    if (flash > 0) { ctx.fillStyle = "rgba(255,80,30," + flash * 0.5 + ")"; ctx.fillRect(0, 0, W, H); }
    if (state === "playing" && hp < 35) { ctx.fillStyle = "rgba(255,0,0," + (0.08 + 0.06 * Math.sin(T * 8)) + ")"; ctx.fillRect(0, 0, W, H); }
    const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vig.addColorStop(0, "rgba(0,0,0,0)"); vig.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  }
  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016); lastTs = ts;
    update(dt); render(); requestAnimationFrame(loop);
  }

  // ——— Input ———
  window.addEventListener("keydown", (e) => {
    keys[e.key] = true; audioInit();
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    if ((e.key === "x" || e.key === "X") && state === "playing") fireBeam();
    if ((e.key === "Enter" || e.key === " ") && (state === "menu" || state === "gameover")) startGame();
  });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });
  // drag-anywhere relative control
  let dragId = null, dragSX = 0, dragSY = 0, dragPX = 0, dragPY = 0;
  function setTouch() { if (!isTouch) { isTouch = true; if (state === "playing") fireBtn.classList.add("visible"); } }
  canvas.addEventListener("touchstart", (e) => {
    setTouch(); audioInit(); e.preventDefault(); if (state !== "playing" || dragId !== null) return;
    const t = e.changedTouches[0]; dragId = t.identifier; dragSX = t.clientX; dragSY = t.clientY; dragPX = player.x; dragPY = player.y;
    player.tx = player.x; player.ty = player.y;
  }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === dragId) { player.tx = dragPX + (t.clientX - dragSX) * 1.4; player.ty = dragPY + (t.clientY - dragSY) * 1.4; }
  }, { passive: false });
  const endDrag = (e) => { for (const t of e.changedTouches) if (t.identifier === dragId) { dragId = null; player.tx = null; player.ty = null; } };
  canvas.addEventListener("touchend", endDrag); canvas.addEventListener("touchcancel", endDrag);
  // mouse drag for desktop
  let mouseDown = false;
  canvas.addEventListener("mousedown", (e) => { audioInit(); if (state !== "playing") return; mouseDown = true; player.tx = e.offsetX; player.ty = e.offsetY; });
  canvas.addEventListener("mousemove", (e) => { if (mouseDown) { player.tx = e.offsetX; player.ty = e.offsetY; } });
  window.addEventListener("mouseup", () => { mouseDown = false; player.tx = null; player.ty = null; });
  fireBtn.addEventListener("touchstart", (e) => { e.preventDefault(); e.stopPropagation(); fireBeam(); fireBtn.classList.add("pressed"); }, { passive: false });
  fireBtn.addEventListener("touchend", () => fireBtn.classList.remove("pressed"));
  fireBtn.addEventListener("click", fireBeam);
  startBtn.addEventListener("click", (e) => { e.preventDefault(); startGame(); });
  startBtn.addEventListener("touchend", (e) => { e.preventDefault(); setTouch(); startGame(); });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 120));
  document.addEventListener("visibilitychange", () => { lastTs = performance.now(); if (AC) { document.hidden ? AC.suspend().catch(() => {}) : AC.resume().catch(() => {}); } });
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) isTouch = true;
  try { if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } } catch (e) {}

  resize(); showMenu(false); lastTs = performance.now(); requestAnimationFrame(loop);
  window.__IRON_STRIKE__ = { getState: () => state, startGame, getScore: () => score, getWave: () => wave,
    tick: (n) => { for (let i = 0; i < (n || 1); i++) update(1 / 60); render(); } };
})();
</script>
</body>
</html>
